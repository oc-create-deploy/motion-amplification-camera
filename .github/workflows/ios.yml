name: Flutter iOS
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Verify formatting
        run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build unsigned iPhone app
        run: flutter build ios --debug --simulator
      - name: Run native tests
        run: xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16 Pro' CODE_SIGNING_ALLOWED=NO
